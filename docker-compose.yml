services:
  mysql:
    image: mysql:8.4
    container_name: nexo_assist_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nexo_assist
      MYSQL_USER: nexo
      MYSQL_PASSWORD: nexo_password
    ports:
      - '3306:3306'
    volumes:
      - nexo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  nexo_mysql_data:
    driver: local
